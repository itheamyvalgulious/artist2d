[project]
name = "pixel-art-agent"
version = "1.0.0"
description = "Commercial-grade 2D pixel art asset generation pipeline (Godot mannequins + Gemini image APIs)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "scikit-image>=0.24",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests that require built output assets"]
