[project]
name = "pixel-art-agent"
version = "1.0.0"
description = "Commercial-grade 2D pixel art asset generation pipeline (Godot mannequins + Gemini image APIs)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "scikit-image>=0.24",
]

# This project intentionally has no code unit tests: acceptance is a
# 100%-coverage multimodal review by an independent subagent (see README §5).
